; Imzo Device firmware: LilyGO T-Display S3 AMOLED (ESP32-S3, 536x240 RM67162 over QSPI).
; The portable protocol core lives in lib/imzo_core and is also built on the host (device/host).
[env:tdisplay_amoled]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DU8G2_USE_LARGE_FONTS
    ; Development build: also read frames and test commands from USB serial. Remove for the shipping firmware.
    -DIMZO_DEV_SERIAL
build_unflags = -std=gnu++11
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    ricmoo/QRCode@0.0.1
